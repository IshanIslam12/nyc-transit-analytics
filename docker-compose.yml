services:
  db:
    image: postgres:17
    container_name: nyc-transit-db

    environment:
      POSTGRES_USER: transit_user
      POSTGRES_PASSWORD: transit_password
      POSTGRES_DB: transit_db

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U transit_user -d transit_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend

    container_name: nyc-transit-backend

    environment:
      DATABASE_URL: postgresql://transit_user:transit_password@db:5432/transit_db

    ports:
      - "8000:8000"

    volumes:
      - ./data:/data:ro

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

  collector:
    build:
      context: ./backend

    container_name: nyc-transit-collector

    command:
      [
        "python",
        "collector.py"
      ]

    environment:
      DATABASE_URL: postgresql://transit_user:transit_password@db:5432/transit_db

    volumes:
      - ./data:/data:ro

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend

    container_name: nyc-transit-frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

    restart: unless-stopped


volumes:
  postgres_data: