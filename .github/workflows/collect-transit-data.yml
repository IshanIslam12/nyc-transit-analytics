name: Collect Transit Data

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Collect MTA transit data
        run: |
          curl --fail \
            --retry 3 \
            --retry-all-errors \
            --max-time 180 \
            --request POST \
            "https://nyc-transit-analytics.onrender.com/api/transit/collect?limit=500"